<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Deck Simulator</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="app">
    <h1>MTG Deck Simulator</h1>

    <h2>Deck Management</h2>
    <label for="deckInput">Deck List (CSV Format)</label>
    <textarea id="deckInput" rows="10"></textarea>

    <label for="deckNameInput">Deck Name:</label>
    <input type="text" id="deckNameInput" placeholder="My Bello Deck" />

    <label for="deckSelector">Load Deck:</label>
    <select id="deckSelector"></select>

    <div class="btn-row">
      <button id="pasteClipboard">📋 Paste from Clipboard</button>
      <button id="saveDeckBtn">💾 Save Deck</button>
      <button id="loadDeckBtn">📂 Load Deck</button>
    </div>

    <h2>Conditions</h2>
    <div id="conditionEditor">
      <label for="typeSelect">Card Type:</label>
      <select id="typeSelect"></select>

      <label>Min:</label>
      <input type="number" id="minInput" value="1" style="width: 50px;" />

      <label>Max:</label>
      <input type="number" id="maxInput" style="width: 50px;" />

      <button id="addConditionBtn">➕ Add Condition</button>
    </div>

    <ul id="conditionsList" style="padding-left: 1em;"></ul>

    <div id="conditionsContainer"></div>

    <button id="addConditionSetBtn">➕ Add Condition Set</button>
    <input type="text" id="condition-name" placeholder="Condition Set Name">

    <div class="btn-row">
      <button id="deleteSetBtn">🗑️ Delete Set</button>
      <button id="saveSetBtn">💾 Save Set</button>
      <button id="loadSetBtn">📂 Load Set</button>
    </div>

    <label>Mulligans (Commander allows 1 free mulligan)</label>
    <input type="number" id="mulligans" value="1" min="0" max="5">

    <label>Fast Threshold (turns)</label>
    <input type="number" id="fast-threshold" value="8" min="1" max="10">

    <label>Slow Threshold (turns)</label>
    <input type="number" id="slow-threshold" value="9" min="1" max="10">

    <button id="runSimBtn">▶ Run Simulation</button>

    <div id="results" class="results">
      <div id="fast-label"></div>
      <div id="slow-label"></div>
      <canvas id="chart" width="400" height="200"></canvas>
    </div>

    <button id="exitBtn">❌ Exit</button>
    <button id="updateCacheBtn">🔄 Update Cache</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    eruda.init();
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
</body>
</html>
